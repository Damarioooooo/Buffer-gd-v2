
name: Build Geode mod (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build for iOS
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build iOS Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: iOS
          path: .
          bindings: vwtfafa/bindings
          bindings-ref: fix/2.2081-depends
          use-cpm-cache: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveInputBuffer-iOS-build
          path: ${{ steps.build.outputs.build-output }}/
          if-no-files-found: error
          retention-days: 14
